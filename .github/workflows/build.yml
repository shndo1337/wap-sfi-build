name: build-sfi-trollstore

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: sing-box ref (tag/branch)
        default: testing
      apple_ref:
        description: sing-box-for-apple ref (tag/branch)
        default: dev

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.singbox_ref }}
          path: sing-box

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-apple
          ref: ${{ inputs.apple_ref }}
          path: sing-box-for-apple
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Tools
        run: brew install ldid xcbeautify

      - name: Build Libbox.xcframework (iOS)
        working-directory: sing-box
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          find .. -name 'Libbox.xcframework' -maxdepth 3 -not -path '*/node_modules/*'

      - name: Place Libbox next to the Xcode project
        run: |
          src="$(find . -name 'Libbox.xcframework' -maxdepth 3 | head -1)"
          test -n "$src"
          if [ ! -e sing-box-for-apple/Libbox.xcframework ]; then
            cp -R "$src" sing-box-for-apple/Libbox.xcframework
          fi

      - name: Build unsigned app
        working-directory: sing-box-for-apple
        run: |
          set -o pipefail
          xcodebuild -version
          if ! xcodebuild build -skipPackagePluginValidation \
            -scheme SFI -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            BASE_PACKAGE_IDENTIFIER=io.nekohasekai.sfajb \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_BITCODE=NO \
            DISABLE_SWIFTLINT=1 > build.log 2>&1; then
            echo "=== xcodebuild failed; compiler errors ==="
            grep -n -B2 -A6 -E "error:|fatal error" build.log | head -120
            exit 1
          fi
          ls build/dd/Build/Products/Release-iphoneos

      - name: Fake-sign with entitlements and pack IPA
        working-directory: sing-box-for-apple
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/sing-box.app"
          test -d "$APP"
          ENT="Jailbreak"
          # the helper-daemon mach-lookup key is only for the jailbreak build
          for p in "$ENT"/App.plist "$ENT"/Extension.plist; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.exception.mach-lookup.global-name" "$p" 2>/dev/null || true
          done
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          # ad-hoc sign every nested Mach-O first
          while IFS= read -r f; do
            file -b "$f" | grep -q Mach-O && ldid -S "$f" || true
          done < <(find "$APP" -type f -perm +111)
          # entitlements for the tunnel extension and main app
          ls "$ENT"; ls "$APP" "$APP/PlugIns" || true
          # tunnel extension = the appex whose bundle id ends with .extension
          for appex in "$APP"/PlugIns/*.appex; do
            exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")"
            bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")"
            echo "appex $appex exe=$exe id=$bid"
            case "$bid" in
              *.extension) ldid -S"$ENT/Extension.plist" "$appex/$exe" ;;
            esac
          done
          main="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ldid -S"$ENT/App.plist" "$APP/$main"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry ../sing-box-trollstore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-trollstore-ipa
          path: sing-box-trollstore.ipa
